<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gmail API - Fetch & Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://apis.google.com/js/api.js" async defer></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-4xl w-full bg-white rounded-lg shadow-lg p-8">
      <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-gray-900 mb-2">Gmail Sync</h1>
        <p class="text-gray-600">Fetch and store your Gmail messages</p>
      </div>

      <div
        id="status"
        class="mb-6 p-4 rounded-lg bg-blue-50 text-blue-700 hidden"
      >
        <div class="flex items-center">
          <svg class="animate-spin h-5 w-5 mr-3" viewBox="0 0 24 24">
            <circle
              class="opacity-25"
              cx="12"
              cy="12"
              r="10"
              stroke="currentColor"
              stroke-width="4"
              fill="none"
            ></circle>
            <path
              class="opacity-75"
              fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
            ></path>
          </svg>
          <span id="status-text">Initializing...</span>
        </div>
      </div>

      <div id="output" class="space-y-4"></div>

      <div class="mt-6 text-center">
        <a
          href="all_mail.html"
          class="inline-block px-6 py-3 bg-blue-500 hover:bg-blue-600 text-white rounded-lg font-medium transition"
        >
          View All Mail →
        </a>
      </div>
    </div>

    <script>
      const API_KEY = "AIzaSyDGnyh_Cdm48eLB4z_8Gxmf9pIJnXMUCHw";
      const CLIENT_ID =
        "812299472977-2mea8dbh4rb5ut9i099cbkaht9h22k0v.apps.googleusercontent.com";
      const SCOPES = "https://www.googleapis.com/auth/gmail.readonly";

      let tokenClient;
      let gapiInited = false;
      let gisInited = false;

      function showStatus(message, isError = false) {
        const statusEl = document.getElementById("status");
        const statusText = document.getElementById("status-text");
        statusEl.classList.remove(
          "hidden",
          "bg-blue-50",
          "text-blue-700",
          "bg-red-50",
          "text-red-700",
          "bg-green-50",
          "text-green-700"
        );

        if (isError) {
          statusEl.classList.add("bg-red-50", "text-red-700");
        } else if (message.includes("Successfully")) {
          statusEl.classList.add("bg-green-50", "text-green-700");
        } else {
          statusEl.classList.add("bg-blue-50", "text-blue-700");
        }

        statusText.textContent = message;
      }

      function gapiLoaded() {
        gapi.load("client", async () => {
          await gapi.client.init({
            apiKey: API_KEY,
            discoveryDocs: [
              "https://www.googleapis.com/discovery/v1/apis/gmail/v1/rest",
            ],
          });
          gapiInited = true;
          maybeStart();
        });
      }

      function gisLoaded() {
        tokenClient = google.accounts.oauth2.initTokenClient({
          client_id: CLIENT_ID,
          scope: SCOPES,
          callback: "",
        });
        gisInited = true;
        maybeStart();
      }

      function maybeStart() {
        if (!gapiInited || !gisInited) return;

        tokenClient.callback = async (resp) => {
          if (resp.error) {
            console.error("Token error:", resp);
            showStatus("Authentication failed: " + resp.error, true);
            return;
          }
          try {
            await fetchGmailData();
          } catch (e) {
            console.error("Fetch error:", e);
            showStatus("Error fetching emails: " + e.message, true);
          }
        };

        if (!gapi.client.getToken()) {
          tokenClient.requestAccessToken({ prompt: "consent" });
        } else {
          fetchGmailData();
        }
      }

      async function fetchGmailData() {
        const outputEl = document.getElementById("output");
        showStatus("Fetching messages from Gmail...");
        outputEl.innerHTML = "";

        try {
          const listRes = await gapi.client.gmail.users.messages.list({
            userId: "me",
            maxResults: 50,
            q: "category:primary",
          });

          console.log("Message list response:", listRes);

          if (
            !listRes.result.messages ||
            listRes.result.messages.length === 0
          ) {
            showStatus("No messages found in your inbox.", true);
            outputEl.innerHTML =
              "<p class='text-gray-600 text-center'>No messages found.</p>";
            return;
          }

          const emails = [];
          showStatus(
            `Processing ${listRes.result.messages.length} messages...`
          );

          for (const msg of listRes.result.messages) {
            const msgRes = await gapi.client.gmail.users.messages.get({
              userId: "me",
              id: msg.id,
              format: "full",
            });

            const payload = msgRes.result.payload || {};
            const headers = payload.headers || [];

            const subject =
              (headers.find((h) => h.name === "Subject") || {}).value ||
              "(no subject)";
            const from =
              (headers.find((h) => h.name === "From") || {}).value ||
              "(unknown sender)";
            const date =
              (headers.find((h) => h.name === "Date") || {}).value || "";
            const to = (headers.find((h) => h.name === "To") || {}).value || "";

            const bodyText = extractMessageBody(payload);
            const preview = bodyText
              ? bodyText.slice(0, 200).replace(/\s+/g, " ").trim()
              : "(no body)";

            // Extract sender name and email
            const senderMatch = from.match(/^(.*?)\s*<(.+?)>$/) || [
              null,
              from,
              from,
            ];
            const senderName = senderMatch[1]?.trim() || from;
            const senderEmail = senderMatch[2]?.trim() || from;

            // Get intent predictions from API
            const categories = await getPredictions(subject, bodyText);

            emails.push({
              id: msg.id,
              sender: senderName,
              senderEmail: senderEmail,
              subject: subject,
              preview: preview,
              time: formatDate(date),
              date: date,
              to: to,
              content: bodyText,
              categories: categories.labels || [],
              scores: categories.scores || {},
            });
          }

          // Store emails in localStorage
          showStatus("Storing emails...");
          try {
            const existingEmails = localStorage.getItem("gmail_emails");
            if (existingEmails) {
              console.log("Clearing existing emails from localStorage");
              localStorage.removeItem("gmail_emails");
            }

            localStorage.setItem("gmail_emails", JSON.stringify(emails));
            console.log(`Stored ${emails.length} new emails in localStorage`);
            showStatus(`Successfully stored ${emails.length} emails!`);
            displayEmailsSummary(emails);
          } catch (storageError) {
            console.error("Storage error:", storageError);
            showStatus("Error storing emails: " + storageError.message, true);
          }
        } catch (err) {
          console.error("Error fetching Gmail data:", err);
          showStatus(
            "Error: " + (err.message || "See console for details"),
            true
          );
        }
      }

      // Function to get predictions from API
      async function getPredictions(subject, body) {
        try {
          const text = `${subject} ${body}`.trim();

          // Call the prediction API
          const response = await fetch(
            `http://0.0.0.0:8000/predict?text=${encodeURIComponent(text)}&threshold=0.55&return_all=false`
          );

          if (!response.ok) {
            console.error("API error:", response.status);
            return { labels: [], scores: {} };
          }

          const data = await response.json();
          // Extract labels and scores
          const predictions = data.predictions.slice(0, 2);
          const labels = predictions.map((p) => p.label);
          const scores = {};
          predictions.forEach((p) => {
            scores[p.label] = p.score;
          });

          console.log("Predictions for email:", { subject, labels, scores });

          return { labels, scores };
        } catch (error) {
          console.error("Error getting predictions:", error);
          return { labels: [], scores: {} };
        }
      }

      function displayEmailsSummary(emails) {
        const outputEl = document.getElementById("output");

        // Count emails by category
        const categoryCounts = {};
        emails.forEach((email) => {
          email.categories.forEach((cat) => {
            categoryCounts[cat] = (categoryCounts[cat] || 0) + 1;
          });
        });

        outputEl.innerHTML = `
    <div class="bg-white border border-gray-200 rounded-lg p-6">
      <h3 class="text-xl font-bold text-gray-900 mb-4">Emails Stored Successfully</h3>
      <div class="grid grid-cols-2 gap-4">
        <div class="bg-blue-50 rounded-lg p-4">
          <p class="text-sm text-gray-600 mb-1">Total Emails</p>
          <p class="text-3xl font-bold text-blue-600">${emails.length}</p>
        </div>
        <div class="bg-green-50 rounded-lg p-4">
          <p class="text-sm text-gray-600 mb-1">Latest Email</p>
          <p class="text-lg font-semibold text-green-600">${emails[0]?.sender || "N/A"}</p>
        </div>
      </div>
      
      <!-- Category Distribution -->
      <div class="mt-4">
        <h4 class="text-sm font-semibold text-gray-700 mb-2">Categories:</h4>
        <div class="flex flex-wrap gap-2">
          ${Object.entries(categoryCounts)
            .sort((a, b) => b[1] - a[1])
            .map(
              ([cat, count]) => `
              <span class="px-3 py-1 ${getCategoryColorClasses(cat)} rounded-full text-xs font-medium">
                ${cat}: ${count}
              </span>
            `
            )
            .join("")}
        </div>
      </div>
      
      <div class="mt-4 space-y-2">
        ${emails
          .slice(0, 5)
          .map(
            (email) => `
          <div class="flex items-center justify-between p-3 bg-gray-50 rounded">
            <div class="flex-1">
              <p class="font-semibold text-gray-900 text-sm">${email.subject}</p>
              <p class="text-xs text-gray-500">${email.sender}</p>
              ${
                email.categories.length > 0
                  ? `
                <div class="flex flex-wrap gap-1 mt-1">
                  ${email.categories
                    .map(
                      (cat) => `
                    <span class="px-2 py-0.5 ${getCategoryColorClasses(cat)} rounded text-xs">
                      ${cat}
                    </span>
                  `
                    )
                    .join("")}
                </div>
              `
                  : ""
              }
            </div>
          </div>
        `
          )
          .join("")}
        ${emails.length > 5 ? `<p class="text-sm text-gray-500 text-center mt-2">and ${emails.length - 5} more...</p>` : ""}
      </div>
    </div>
  `;
      }

      function getCategoryColorClasses(category) {
        const colorMap = {
          Business: "bg-blue-100 text-blue-700",
          Personal: "bg-purple-100 text-purple-700",
          Promotions: "bg-pink-100 text-pink-700",
          "Customer Support": "bg-red-100 text-red-700",
          "Job Application": "bg-indigo-100 text-indigo-700",
          "Finance & Bills": "bg-yellow-100 text-yellow-700",
          "Events & Invitations": "bg-green-100 text-green-700",
          "Travel & Bookings": "bg-teal-100 text-teal-700",
          Reminders: "bg-orange-100 text-orange-700",
          Newsletters: "bg-cyan-100 text-cyan-700",
        };
        return colorMap[category] || "bg-gray-100 text-gray-700";
      }

      function getLabelColorClasses(color) {
        const colors = {
          blue: "bg-blue-100 text-blue-700",
          green: "bg-green-100 text-green-700",
          purple: "bg-purple-100 text-purple-700",
          orange: "bg-orange-100 text-orange-700",
          red: "bg-red-100 text-red-700",
          yellow: "bg-yellow-100 text-yellow-700",
          pink: "bg-pink-100 text-pink-700",
          teal: "bg-teal-100 text-teal-700",
          cyan: "bg-cyan-100 text-cyan-700",
          indigo: "bg-indigo-100 text-indigo-700",
        };
        return colors[color] || colors.blue;
      }

      function categorizeEmail(subject, body, from) {
        const text = (subject + " " + body + " " + from).toLowerCase();

        if (
          text.includes("invoice") ||
          text.includes("payment") ||
          text.includes("finance") ||
          text.includes("billing")
        ) {
          return { name: "Finance", color: "yellow" };
        }
        if (
          text.includes("support") ||
          text.includes("ticket") ||
          text.includes("help")
        ) {
          return { name: "Support", color: "red" };
        }
        if (
          text.includes("newsletter") ||
          text.includes("subscribe") ||
          text.includes("unsubscribe")
        ) {
          return { name: "Newsletter", color: "purple" };
        }
        if (
          text.includes("meeting") ||
          text.includes("calendar") ||
          text.includes("reminder")
        ) {
          return { name: "Personal", color: "orange" };
        }
        if (
          text.includes("project") ||
          text.includes("work") ||
          text.includes("team")
        ) {
          return { name: "Work", color: "green" };
        }
        return { name: "Business", color: "blue" };
      }

      function formatDate(dateString) {
        if (!dateString) return "Unknown date";
        const date = new Date(dateString);
        const now = new Date();
        const diffTime = Math.abs(now - date);
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

        if (diffDays === 0) {
          return date.toLocaleTimeString("en-US", {
            hour: "numeric",
            minute: "2-digit",
            hour12: true,
          });
        } else if (diffDays === 1) {
          return "Yesterday";
        } else if (diffDays < 7) {
          return `${diffDays} days ago`;
        } else {
          return date.toLocaleDateString("en-US", {
            month: "short",
            day: "numeric",
            year: "numeric",
          });
        }
      }

      function extractMessageBody(payload) {
        const parts = [];

        function walk(part) {
          if (!part) return;
          if (part.parts && part.parts.length) {
            part.parts.forEach(walk);
          } else {
            parts.push(part);
          }
        }

        walk(payload);

        const candidate =
          parts.find((p) => p.mimeType === "text/plain") ||
          (payload.mimeType === "text/plain" ? payload : null);

        if (!candidate || !candidate.body || !candidate.body.data) return "";

        const body = candidate.body.data;
        const decoded = atob(body.replace(/-/g, "+").replace(/_/g, "/"));
        return decoded;
      }

      window.gapiLoaded = gapiLoaded;
      window.gisLoaded = gisLoaded;
    </script>

    <script
      src="https://apis.google.com/js/api.js"
      onload="gapiLoaded()"
    ></script>
    <script
      src="https://accounts.google.com/gsi/client"
      onload="gisLoaded()"
    ></script>
  </body>
</html>
