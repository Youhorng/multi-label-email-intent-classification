<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - Smart Mailbox</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script/dashboard.js"></script>
  </head>
  <body class="bg-gray-50 m-0 p-0">
    <div class="flex min-h-screen">
      <!-- Sidebar -->
      <aside
        class="hidden md:flex md:w-20 bg-white shadow-lg flex-col items-center py-6 space-y-8"
      >
        <a
          href="#"
          class="w-12 h-12 bg-blue-500 rounded-xl flex items-center justify-center text-white hover:bg-blue-600 transition"
        >
          <i class="fas fa-envelope text-xl"></i>
        </a>

        <a
          href="dashboard.html"
          class="w-12 h-12 flex items-center justify-center text-blue-500 bg-blue-50 rounded-xl transition"
        >
          <i class="fas fa-chart-line text-xl"></i>
        </a>

        <a
          href="all_mail.html"
          class="w-12 h-12 flex items-center justify-center text-gray-400 hover:text-blue-500 hover:bg-blue-50 rounded-xl transition"
        >
          <i class="fas fa-inbox text-xl"></i>
        </a>

        <a
          href="classify_mail.html"
          class="w-12 h-12 flex items-center justify-center text-gray-400 hover:text-blue-500 hover:bg-blue-50 rounded-xl transition"
        >
          <i class="fas fa-file-alt text-xl"></i>
        </a>
      </aside>

      <!-- Main Content -->
      <main class="flex-1 w-full overflow-x-hidden">
        <!-- Mobile Header -->
        <div
          class="md:hidden bg-white shadow-sm px-4 py-4 flex items-center justify-between"
        >
          <button id="mobile-sidebar-btn" class="text-gray-600">
            <i class="fas fa-bars text-xl"></i>
          </button>
          <h1 class="text-lg font-bold text-gray-900">Dashboard</h1>
          <div class="w-6"></div>
        </div>

        <!-- Page Header -->
        <div class="px-4 md:px-8 lg:px-12 py-6 md:py-8">
          <h1
            class="text-2xl md:text-3xl lg:text-4xl font-bold text-gray-900 mb-2"
          >
            Dashboard
          </h1>
          <p class="text-sm md:text-base text-gray-600 flex items-center">
            <span class="mr-2">👋</span>
            Welcome back! Here's a quick overview of your email activity.
          </p>
        </div>

        <!-- Overview Section -->
        <div class="px-4 md:px-8 lg:px-12 mb-8">
          <h2 class="text-lg md:text-xl font-semibold text-gray-400 mb-4">
            Overview
          </h2>

          <div
            id="overview-cards"
            class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6"
          >
            <!-- Cards will be generated by JavaScript -->
          </div>
        </div>

        <!-- Charts Section -->
        <div class="px-4 md:px-8 lg:px-12 mb-8">
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Total Mail Chart -->
            <div class="lg:col-span-2 bg-white rounded-2xl shadow-md p-6">
              <div class="flex items-center justify-between mb-6">
                <h3 class="text-lg font-bold text-gray-900">Total mail</h3>
                <div class="flex items-center space-x-2">
                  <span class="w-3 h-3 bg-blue-500 rounded-full"></span>
                  <span class="text-sm text-gray-600">Mail</span>
                </div>
              </div>
              <div class="h-64 md:h-80">
                <canvas id="lineChart"></canvas>
              </div>
            </div>

            <!-- Recent Mail -->
            <div class="bg-white rounded-2xl shadow-md p-6">
              <div class="flex items-center justify-between mb-6">
                <h3 class="text-lg font-bold text-gray-900">Recent mail</h3>
                <div class="flex items-center space-x-2">
                  <button class="text-gray-400 hover:text-gray-600">
                    <i class="fas fa-search"></i>
                  </button>
                  <button class="text-gray-400 hover:text-gray-600">
                    <i class="fas fa-bars"></i>
                  </button>
                </div>
              </div>

              <div class="space-y-4" id="recent-emails"></div>
            </div>
          </div>
        </div>

        <!-- Insight Summary Section -->
        <div class="px-4 md:px-8 lg:px-12 pb-8">
          <h2 class="text-lg md:text-xl font-semibold text-gray-300 mb-6">
            Insight summary
          </h2>

          <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- Trending Label Chart -->
            <div class="bg-gray-50 rounded-2xl shadow-sm p-6 md:p-8">
              <h3 class="text-lg md:text-xl font-bold text-gray-900 mb-8">
                Trending label
              </h3>
              <div class="h-72 md:h-80">
                <canvas id="barChart"></canvas>
              </div>
            </div>

            <!-- Mail Distribution Chart -->
            <div class="bg-blue-50 rounded-2xl shadow-sm p-6 md:p-8">
              <h3 class="text-lg md:text-xl font-bold text-gray-900 mb-8">
                Mail Distribution
              </h3>
              <div
                class="flex flex-col md:flex-row items-center justify-between gap-8"
              >
                <div class="w-48 h-48 md:w-56 md:h-56 flex-shrink-0">
                  <canvas id="doughnutChart"></canvas>
                </div>
                <div
                  class="space-y-4 w-full md:w-auto"
                  id="doughnut-legend"
                ></div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- Mobile Sidebar Overlay -->
    <div
      id="mobile-sidebar"
      class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 md:hidden"
    >
      <div class="bg-white w-64 h-full shadow-xl p-6">
        <div class="flex items-center justify-between mb-8">
          <h2 class="text-xl font-bold text-gray-900">Menu</h2>
          <button id="close-sidebar" class="text-gray-600">
            <i class="fas fa-times text-xl"></i>
          </button>
        </div>

        <nav class="space-y-4">
          <a
            href="#"
            class="flex items-center space-x-3 text-blue-500 bg-blue-50 px-4 py-3 rounded-lg"
          >
            <i class="fas fa-chart-line"></i>
            <span>Dashboard</span>
          </a>
          <a
            href="#"
            class="flex items-center space-x-3 text-gray-700 hover:text-blue-500 hover:bg-blue-50 px-4 py-3 rounded-lg transition"
          >
            <i class="fas fa-inbox"></i>
            <span>Inbox</span>
          </a>
          <a
            href="#"
            class="flex items-center space-x-3 text-gray-700 hover:text-blue-500 hover:bg-blue-50 px-4 py-3 rounded-lg transition"
          >
            <i class="fas fa-file-alt"></i>
            <span>Classify Mail</span>
          </a>
        </nav>
      </div>
    </div>
  </body>
</html>
